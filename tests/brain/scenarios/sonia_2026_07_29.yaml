# Sonia's review of 2026-07-29 (current_feedback/email_1), one case per reported
# failure. Her wording is kept in `why` so a red test explains itself.
#
# `classify:` stands in for the classifier so the routing test runs without the
# API. `xfail:` marks behaviour that is not built yet - the marker is strict, so
# the day it lands this suite fails and tells us to delete the marker.

- id: pregnancy_announcement
  source: "email_1:21"
  why: "It asked qualifying questions after someone shared that she was pregnant."
  turns:
    - lead: "I just got my positive test!! After 3 years I still can't believe it"
      classify:
        intent: pregnancy_or_success
      expect:
        mode: CELEBRATE
        not_mode: [QUALIFY, BOOK]
        no_question: true
        no_booking_link: true
        max_chars: 300

- id: gratitude_for_content
  source: "email_1:21"
  why: "It asked qualifying questions after someone thanked me for my content."
  turns:
    - lead: "just wanted to say thank you, your posts have helped me so much"
      classify:
        intent: gratitude
      expect:
        mode: ACKNOWLEDGE
        not_mode: [QUALIFY, BOOK]
        no_question: true
        no_link: true
        max_chars: 300

- id: decided_to_stop_trying
  source: "email_1:21,71"
  why: "It asked qualifying questions after someone said she had decided to stop trying for a baby."
  turns:
    - lead: "we've decided to stop trying. after 6 years I just can't do it anymore"
      classify:
        intent: grief_or_stopped_trying
        situation: hopeless
      expect:
        mode: ACKNOWLEDGE
        not_mode: [QUALIFY, BOOK, RESOURCE]
        no_question: true
        no_booking_link: true
        # She calls the masterclass redirect out by name as template matching.
        not_contains: ["masterclass", "free training", "replay"]

- id: rich_situation_not_re_asked
  source: "email_1:27"
  why: >-
    Someone explained that she had completed 4 IVF cycles, changed her diet, taken
    supplements and worked with several practitioners. The AI then asked what else
    she had already tried.
  turns:
    - lead: >-
        I've done 4 IVF cycles, completely changed my diet, I'm on every supplement
        going and I've worked with three different practitioners. Nothing has worked.
      classify:
        intent: new_prospect
        richness: rich
      set_slots:
        what_tried: "4 IVF cycles, diet change, supplements, three practitioners"
        treatment_path: ivf
      expect:
        not_mode: [BOOK]
        next_question_not:
          - "how long she has been trying, and what she has already tried"
        not_contains: ["what else have you tried", "what have you already tried"]

- id: ivf_prep_is_priority_enough
  source: "email_1:29"
  why: >-
    Another prospect said she was preparing for IVF in September, but the AI
    continued asking how much of a priority pregnancy was.
  xfail: >-
    Whether the priority question gets re-asked depends entirely on the classifier
    choosing to infer strong_readiness from "preparing for IVF in September" - it
    often does, which is why this passes live, and Sonia saw the times it did not.
    gates._priority_ok itself accepts only priority_score >= 8 or strong_readiness,
    so nothing makes it reliable. Manual 2A section 9 lists "preparing for treatment
    soon" as a strong-priority signal in its own right; making that deterministic in
    the gate removes the dependency on inference. Fixed in Stage 2.
  xfail_scope: routing
  state:
    slots:
      age: 36
      trying_duration: "2 years"
      treatment_path: ivf
    flags:
      situation_shared: true
  turns:
    - lead: "I'm preparing for IVF in September"
      classify:
        intent: answers_question
        richness: partial
      expect:
        mode: QUALIFY
        next_question_not:
          - "how much of a priority getting pregnant is for her right now"
        not_contains: ["scale of 1 to 10", "top priority"]

- id: answer_the_question_before_qualifying
  source: "email_1:35"
  why: >-
    When someone asked whether anything could realistically make a difference in the
    6 weeks before IVF, the AI avoided answering and moved straight back into
    qualification.
  turns:
    - lead: "Can anything realistically make a difference in the 6 weeks before my IVF cycle?"
      classify:
        intent: general_fertility_question
        question: "Can anything realistically make a difference in the 6 weeks before my IVF cycle?"
        slots:
          treatment_path: ivf
      expect:
        mode: ANSWER
        not_mode: [QUALIFY, BOOK]
        no_booking_link: true

- id: honest_decline_young_and_early
  source: "email_1:37"
  why: >-
    When someone asked whether she should join the program after trying naturally for
    only 3 months at age 29, the AI described my services instead of honestly
    assessing whether she may even need this level of support.
  state:
    slots:
      age: 29
      trying_duration: "3 months"
      treatment_path: natural
    flags:
      situation_shared: true
  turns:
    - lead: "I'm 29 and we've been trying 3 months. Do I need a program like yours?"
      classify:
        intent: asks_about_program
        question: "Do I need a program like yours?"
      expect:
        mode: HONEST_DECLINE
        not_mode: [QUALIFY, BOOK, EDUCATE]
        no_booking_link: true

# --- One objection is not four objections (email_1:63) -----------------------
# "A financial concern, fear after repeated IVF failure, a husband who does not
#  believe in coaching, and someone asking for free supplement advice are
#  completely different situations."

- id: objection_price_is_its_own_conversation
  source: "email_1:63"
  why: "The AI often responded to all objections with the same general qualification process."
  turns:
    - lead: "honestly it sounds great but I don't think we can afford something like this"
      classify:
        intent: objection_price
      expect:
        mode: ANSWER
        not_mode: [QUALIFY]
        not_contains: ["masterclass"]

- id: objection_fear_after_failure_is_its_own_conversation
  source: "email_1:63"
  why: "Fear after repeated IVF failure is not a price objection and must not get the same reply."
  turns:
    - lead: "I've had 3 failed transfers. I'm scared of getting my hopes up again"
      classify:
        intent: objection_fear_after_failure
        situation: hopeless
      expect:
        mode: ACKNOWLEDGE
        not_mode: [QUALIFY, BOOK]
        no_booking_link: true

- id: objection_partner_is_its_own_conversation
  source: "email_1:63"
  why: "A husband who does not believe in coaching is its own conversation."
  turns:
    - lead: "my husband doesn't really believe in coaching, he thinks we should just keep doing IVF"
      classify:
        intent: objection_partner
      expect:
        mode: ANSWER
        not_mode: [QUALIFY, BOOK]

- id: free_advice_request_is_its_own_conversation
  source: "email_1:63"
  why: "Someone asking for free supplement advice is a completely different situation."
  turns:
    - lead: "what supplements should I be taking for low AMH?"
      classify:
        intent: asks_free_advice
        question: "what supplements should I be taking for low AMH?"
      expect:
        mode: ANSWER
        not_mode: [QUALIFY, BOOK]
        # Non-negotiable: no protocol in DMs (manual Part 1 section 3).
        not_contains: ["mg", "mcg", "iu ", "dosage"]

# --- Not every message ends in a question (email_1:75) -----------------------

- id: qualify_still_asks_exactly_one_question
  source: "email_1:75"
  why: >-
    It appears to believe that every message must end with a question. A genuine
    discovery turn still should - the policy is per mode, not a blanket ban.
  turns:
    - lead: "hi, I saw your post about egg quality and wanted to reach out"
      classify:
        intent: new_prospect
      expect:
        mode: QUALIFY
        has_question: true
