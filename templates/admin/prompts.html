{% extends "base.html" %}
{% block content %}

<div class="flex items-center justify-between mb-6">
  <div>
    <h1 class="text-xl font-bold text-slate-900">Prompt Trace</h1>
    <p class="text-xs text-slate-400 mt-0.5">Full prompt sent to the AI at every turn — last {{ tail }} turns</p>
  </div>
  <div class="flex items-center gap-2">
    <a href="/admin/prompts?tail=50"  class="px-3 py-1.5 rounded-lg text-xs font-medium border {% if tail == 50  %}bg-violet-600 text-white border-violet-600{% else %}border-slate-200 text-slate-500 hover:bg-violet-50 hover:text-violet-700{% endif %} transition-colors">50</a>
    <a href="/admin/prompts?tail=100" class="px-3 py-1.5 rounded-lg text-xs font-medium border {% if tail == 100 %}bg-violet-600 text-white border-violet-600{% else %}border-slate-200 text-slate-500 hover:bg-violet-50 hover:text-violet-700{% endif %} transition-colors">100</a>
    <a href="/admin/prompts?tail=200" class="px-3 py-1.5 rounded-lg text-xs font-medium border {% if tail == 200 %}bg-violet-600 text-white border-violet-600{% else %}border-slate-200 text-slate-500 hover:bg-violet-50 hover:text-violet-700{% endif %} transition-colors">200</a>
  </div>
</div>

{% if content %}
  <div class="bg-slate-900 rounded-xl border border-slate-700 overflow-hidden">
    <div class="flex items-center justify-between px-4 py-2.5 border-b border-slate-700">
      <span class="text-xs text-slate-400 font-mono">{{ log_path }}</span>
      <button onclick="document.getElementById('prompt-log').select(); document.execCommand('copy'); this.textContent='Copied ✓'; setTimeout(()=>this.textContent='Copy all',1500)"
              class="text-xs text-slate-400 hover:text-white transition-colors px-2 py-1 rounded">Copy all</button>
    </div>
    <textarea id="prompt-log" readonly
      class="w-full bg-slate-900 text-slate-100 font-mono text-[11px] leading-relaxed p-4 resize-none outline-none"
      style="height: 75vh; white-space: pre; overflow-x: auto;">{{ content }}</textarea>
  </div>
{% else %}
  <div class="bg-white rounded-xl border border-slate-200 p-10 text-center text-slate-400 text-sm">
    No prompt logs yet — run a simulation or send a real message to see entries here.
  </div>
{% endif %}

{% endblock %}
